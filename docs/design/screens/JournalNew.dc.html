<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>

  <div style="position: relative; padding: 54px 16px 0; display: flex; justify-content: space-between; align-items: center">
    <a href="Journal.dc.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFDF8; border: 1px solid #E8E1D3; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 15px; font-weight: 700">New entry</span>
      <span style="font-size: 12px; color: #6B665E">Sunday, November 15</span>
    </div>
    <span style="width: 44px"></span>
  </div>

  <div style="position: relative; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em; padding-left: 4px">NEED AN IDEA?</span>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #1E2B45; background: #1E2B45; color: #F5F1E8; font-family: inherit; font-size: 13px">What did you notice today?</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #DDD5C6; background: #FFFDF8; color: #1C1C1C; font-family: inherit; font-size: 13px">What did you eat?</button>
        <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #DDD5C6; background: #FFFDF8; color: #1C1C1C; font-family: inherit; font-size: 13px">Tomorrow's plan</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 10px; padding: 20px; min-height: 280px; box-sizing: border-box; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 26px; box-shadow: 0 14px 34px rgba(30,43,69,0.08)">
      <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">WRITE IN ENGLISH</span>
      <textarea style="flex-grow: 1; min-height: 180px; border: none; outline: none; resize: none; background: none; font-family: inherit; font-size: 19px; line-height: 1.6; color: #1C1C1C; padding: 0">This morning I walked to the station. The leaves were turning red, and the air was cold.</textarea>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6B665E">
        <span>Short is best — 1 to 3 sentences</span>
        <span>2 / 3</span>
      </div>
    </label>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #E7EAF1; border-radius: 18px; color: #1E2B45">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <span style="font-size: 13px; line-height: 1.45">We'll match the translation to your level (N4) so it stays readable.</span>
    </div>
  </div>

  <div style="position: relative; padding: 0 20px 36px">
    <a href="JournalEntry.dc.html" style="display: flex; justify-content: center; align-items: center; gap: 10px; height: 58px; background: #B23A30; color: #FFFDF8; border-radius: 29px; font-size: 16px; font-weight: 700; box-shadow: 0 10px 24px rgba(178,58,48,0.3)">
      <span style="font-family: 'Shippori Mincho', serif; font-size: 18px">あ</span>Translate to Japanese</a>
