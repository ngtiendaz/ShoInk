<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShoInk sign in</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E2B45; color: #F5F1E8; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoDark" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#F5F1E8" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoDark)"></rect>
  </svg>
  <div aria-hidden="true" style="position: absolute; right: -70px; top: 70px; width: 220px; height: 220px; border-radius: 50%; background: #B23A30; opacity: 0.92"></div>
  <div aria-hidden="true" style="position: absolute; left: 22px; top: 110px; writing-mode: vertical-rl; font-family: 'Shippori Mincho', serif; font-size: 15px; letter-spacing: 0.6em; color: #B08D57">一日一字</div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 60px 32px 0; position: relative">
    <div style="width: 196px; height: 196px; border-radius: 50%; border: 2px solid #B08D57; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: #1E2B45">
      <div style="width: 176px; height: 176px; border-radius: 50%; border: 1px solid #B08D57; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
        <span style="font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 112px; line-height: 1; color: #F5F1E8">書</span>
      </div>
    </div>
    <span style="font-size: 26px; letter-spacing: 0.04em; color: #F5F1E8; font-weight: 700">Sho<span style="color: #B08D57">Ink</span></span>
    <p style="margin: 4px 0 0; text-align: center; font-size: 17px; line-height: 1.6; color: #F5F1E8">One word. One phrase.<br>Written by hand, every day.</p>
  </div>

  <div style="padding: 0 24px 44px; display: flex; flex-direction: column; gap: 18px; position: relative">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; color: #C9CCD6; letter-spacing: 0.14em; text-align: center">CHOOSE YOUR LEVEL</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <button style="height: 44px; border: 1px solid rgba(245,241,232,0.35); background: none; border-radius: 22px; font-family: inherit; font-size: 15px; color: #F5F1E8">N5</button>
        <button style="height: 44px; border: 1px solid #F5F1E8; background: #F5F1E8; border-radius: 22px; font-family: inherit; font-size: 15px; font-weight: 700; color: #1E2B45">N4</button>
        <button style="height: 44px; border: 1px solid rgba(245,241,232,0.35); background: none; border-radius: 22px; font-family: inherit; font-size: 15px; color: #F5F1E8">N3</button>
        <button style="height: 44px; border: 1px solid rgba(245,241,232,0.35); background: none; border-radius: 22px; font-family: inherit; font-size: 15px; color: #F5F1E8">N2</button>
        <button style="height: 44px; border: 1px solid rgba(245,241,232,0.35); background: none; border-radius: 22px; font-family: inherit; font-size: 15px; color: #F5F1E8">N1</button>
      </div>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; color: #1c1c1c; border-radius: 28px; font-size: 17px; font-weight: 500; background-color: #f5f1e8"><b>Sign in with Apple</b></a>
    <span style="font-size: 12px; color: #C9CCD6; text-align: center; line-height: 1.6">Your progress syncs with iCloud.<br>Terms · Privacy</span>
  </div>
</div>
</x-dc>
