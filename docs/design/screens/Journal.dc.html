<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>
  <div aria-hidden="true" style="position: absolute; right: -50px; top: 36px; width: 150px; height: 150px; border-radius: 50%; background: #EFD9D3"></div>

  <div style="position: relative; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; padding: 0 4px">
      <div style="display: flex; align-items: baseline; gap: 10px">
        <h1 style="margin: 0; font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 40px; letter-spacing: 0.06em">日記</h1>
        <span style="font-size: 16px; color: #6B665E">Journal</span>
      </div>
      <span style="font-size: 12px; color: #6B665E; padding-bottom: 6px">9 entries</span>
    </div>

    <a href="JournalNew.dc.html" style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 18px 20px; background: #1E2B45; color: #F5F1E8; border-radius: 24px">
      <div aria-hidden="true" style="position: absolute; right: -26px; bottom: -40px; width: 110px; height: 110px; border-radius: 50%; background: #B23A30"></div>
      <span style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: #F5F1E8; color: #1E2B45; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
      <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">Write today's entry</span>
        <span style="font-size: 13px; color: #C9CCD6">In English — we'll turn it into Japanese</span>
      </div>
    </a>

    <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em; padding: 4px 4px 0">THIS WEEK</span>

    <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
      <a href="JournalEntry.dc.html" style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 22px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 12px; color: #6B665E">{{e.date}}</span>
          <sc-if value="{{e.sealed}}" hint-placeholder-val="{{ true }}">
            <span aria-label="Copied by hand" style="width: 26px; height: 26px; border: 1.5px solid #B23A30; color: #B23A30; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 12px; font-weight: 800; transform: rotate(-8deg)">書</span>
          </sc-if>
        </div>
        <span style="font-family: 'Shippori Mincho', serif; font-size: 17px; line-height: 1.55; font-weight: 500">{{e.ja}}</span>
        <span style="font-size: 13px; color: #6B665E; line-height: 1.45">{{e.en}}</span>
        <div style="display: flex; gap: 6px">
          <span style="font-size: 11px; color: #1E2B45; background: #E7EAF1; padding: 3px 9px; border-radius: 999px">{{e.words}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <nav style="position: relative; margin: 12px 20px 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 30px; box-shadow: 0 8px 24px rgba(30,43,69,0.08)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="currentColor"></circle></svg>Today</a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"></path></svg>Review</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; border-radius: 24px; background: #1E2B45; color: #F5F1E8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"></path></svg>Journal</a>
    <a href="Notebook.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6zM10 3v18"></path></svg>Notebook</a>
    <a href="Me.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const entries = [
      { date: 'Sat, Nov 14', ja: '友達とラーメンを食べに行きました。', en: 'I went to eat ramen with a friend.', words: '4 new words', sealed: true },
      { date: 'Thu, Nov 12', ja: '雨の日は家で本を読むのが好きです。', en: 'On rainy days I like reading at home.', words: '3 new words', sealed: true },
      { date: 'Wed, Nov 11', ja: '仕事が忙しくて、少し疲れました。', en: 'Work was busy, and I got a little tired.', words: '5 new words', sealed: false }
    ];
    return { entries };
  }
}
</script>
</body>
</html>
