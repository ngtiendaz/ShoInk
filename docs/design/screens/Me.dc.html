<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Me and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>

  <div style="position: relative; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
    <div style="position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: #1E2B45; color: #F5F1E8; border-radius: 24px">
      <div aria-hidden="true" style="position: absolute; right: -30px; top: -30px; width: 100px; height: 100px; border-radius: 50%; background: #B23A30"></div>
      <span style="position: relative; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #B08D57; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 800">書</span>
      <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 700">[Your name]</span>
        <span style="font-size: 12px; color: #C9CCD6">Signed in with Apple · synced</span>
      </div>
    </div>

    <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em; padding: 6px 4px 0">LEARNING</span>
    <div style="display: flex; flex-direction: column; padding: 4px 16px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 22px">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #EDE7DB">
        <span style="font-size: 15px">JLPT level</span>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 3px; background: #EFE9DD; border-radius: 16px">
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">N5</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: #1E2B45; color: #F5F1E8; font-family: inherit; font-size: 13px; font-weight: 700">N4</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">N3</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">N2</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">N1</button>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; border-bottom: 1px solid #EDE7DB">
        <span style="font-size: 15px">Daily session</span><span style="font-size: 14px; color: #6B665E">15 min ›</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0">
        <span style="font-size: 15px">Stroke checking</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; background: #EFE9DD; border-radius: 16px">
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">Gentle</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: #1E2B45; color: #F5F1E8; font-family: inherit; font-size: 13px; font-weight: 700">Standard</button>
          <button style="height: 30px; border: none; border-radius: 13px; background: none; color: #4F4A43; font-family: inherit; font-size: 13px">Strict</button>
        </div>
      </div>
    </div>

    <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em; padding: 6px 4px 0">APP</span>
    <div style="display: flex; flex-direction: column; padding: 0 16px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 22px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EDE7DB">
        <span style="font-size: 15px">Morning reminder · 7:30</span>
        <button role="switch" aria-checked="true" aria-label="Morning reminder" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #1E2B45; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #F5F1E8"></span></button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EDE7DB">
        <span style="font-size: 15px">Sound &amp; haptics</span>
        <button role="switch" aria-checked="true" aria-label="Sound and haptics" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #1E2B45; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #F5F1E8"></span></button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #EDE7DB">
        <span style="font-size: 15px">App language</span><span style="font-size: 14px; color: #6B665E">English ›</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px">
        <span style="font-size: 15px">Credits &amp; data licenses</span><span style="font-size: 14px; color: #6B665E">›</span>
      </div>
    </div>

    <a href="Login.dc.html" style="align-self: center; padding: 10px 18px; font-size: 14px; color: #8E2C24">Sign out</a>
  </div>

  <nav style="position: relative; margin: 0 20px 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 30px; box-shadow: 0 8px 24px rgba(30,43,69,0.08)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="currentColor"></circle></svg>Today</a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"></path></svg>Review</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"></path></svg>Journal</a>
    <a href="Notebook.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6zM10 3v18"></path></svg>Notebook</a>
    <a href="Me.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; border-radius: 24px; background: #1E2B45; color: #F5F1E8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
