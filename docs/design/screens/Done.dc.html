<!doctype html>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E2B45; color: #F5F1E8; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

      </pattern>

    <rect width="100%" height="100%" fill="url(#shippoDark)"></rect>
  </svg>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 60px 28px 0">
    <div style="position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center">

      <h1 style="margin: 0; font-size: 28px; font-weight: 700">Session complete</h1>
      <span style="font-size: 15px; color: #C9CCD6">6-day streak · today's seal earned</span>
    </div>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px">
      <div style="padding: 14px 16px; border-radius: 20px; background: rgba(245,241,232,0.08); border: 1px solid rgba(245,241,232,0.14); display: flex; flex-direction: column"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">14<span style="font-size: 14px"> min</span></span><span style="font-size: 12px; color: #C9CCD6">time today</span></div>
      <div style="padding: 14px 16px; border-radius: 20px; background: rgba(245,241,232,0.08); border: 1px solid rgba(245,241,232,0.14); display: flex; flex-direction: column"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">10</span><span style="font-size: 12px; color: #C9CCD6">characters written</span></div>
      <div style="padding: 14px 16px; border-radius: 20px; background: rgba(245,241,232,0.08); border: 1px solid rgba(245,241,232,0.14); display: flex; flex-direction: column"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">12</span><span style="font-size: 12px; color: #C9CCD6">words reviewed</span></div>
      <div style="padding: 14px 16px; border-radius: 20px; background: rgba(245,241,232,0.08); border: 1px solid rgba(245,241,232,0.14); display: flex; flex-direction: column"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">91%</span><span style="font-size: 12px; color: #C9CCD6">stroke accuracy</span></div>
    </div>
  </div>

  <div style="position: relative; padding: 0 20px 40px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #C9CCD6; text-align: center; padding-bottom: 6px">Tomorrow: 7 reviews and a new word</span>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; background: #F5F1E8; color: #1E2B45; font-size: 16px; font-weight: 700">Back to Today</a>
    <a href="Journal.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 26px; border: 1px solid rgba(245,241,232,0.4); color: #F5F1E8; font-size: 15px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"></path></svg>Write a journal entry</a>
