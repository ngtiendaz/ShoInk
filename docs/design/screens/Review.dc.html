<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>

a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>

  <div style="position: relative; padding: 54px 16px 0; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFDF8; border: 1px solid #E8E1D3; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 800">復習</span>
      <span style="font-size: 13px; color: #6B665E">Review</span>
    </div>
    <span style="width: 44px; font-size: 13px; color: #6B665E; text-align: right">4 / 12</span>
  </div>
  <div style="position: relative; margin: 14px 20px 0; height: 6px; border-radius: 3px; background: #E3DCCD">
    <div style="width: 33%; height: 6px; border-radius: 3px; background: #1E2B45"></div>
  </div>

  <div style="position: relative; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 22px 24px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 28px; box-shadow: 0 14px 34px rgba(30,43,69,0.09)">
      <div aria-hidden="true" style="position: absolute; right: -34px; top: -34px; width: 110px; height: 110px; border-radius: 50%; background: #EFD9D3"></div>
      <span style="position: relative; font-size: 11px; color: #6B665E; letter-spacing: 0.14em">WRITE THIS WORD</span>
      <span style="position: relative; font-size: 28px; font-weight: 700">season</span>
      <span style="position: relative; font-size: 15px; color: #6B665E; letter-spacing: 0.2em; font-family: 'Klee One', serif">きせつ</span>

      <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px">
        <svg viewBox="0 0 100 100" role="img" aria-label="Your handwriting of 季" style="width: 100%; aspect-ratio: 1; background: #F8F4EC; border-radius: 18px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="0.6" stroke-dasharray="2 2"></path>
          <text x="50" y="80" text-anchor="middle" font-size="72" fill="#1C1C1C" font-family="Klee One, serif">季</text>
        </svg>
        <svg viewBox="0 0 100 100" role="img" aria-label="Your handwriting of 節" style="width: 100%; aspect-ratio: 1; background: #F8F4EC; border-radius: 18px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="0.6" stroke-dasharray="2 2"></path>
          <text x="50" y="80" text-anchor="middle" font-size="72" fill="#1C1C1C" font-family="Klee One, serif">節</text>
        </svg>
      </div>

      <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 14px; border-top: 1px dashed #DDD5C6">
        <div style="display: flex; flex-direction: column; gap: 0">
          <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">ANSWER</span>
          <span style="font-family: 'Klee One', serif; font-size: 30px; font-weight: 600">季節</span>
        </div>
        <span style="height: 30px; padding: 0 12px 0 8px; border-radius: 15px; background: #F3E3DF; color: #8E2C24; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Stroke order 92%</span>
      </div>
    </div>

    <p style="margin: 0; font-size: 13px; color: #6B665E; text-align: center">How well did you remember it?</p>
  </div>

  <div style="position: relative; padding: 0 20px 36px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button style="height: 64px; border-radius: 22px; border: 1px solid #E8E1D3; background: #FFFDF8; color: #8E2C24; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">Again</span><span style="font-size: 11px; color: #6B665E">1 min</span></button>
    <button style="height: 64px; border-radius: 22px; border: 1px solid #E8E1D3; background: #FFFDF8; color: #1C1C1C; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">Hard</span><span style="font-size: 11px; color: #6B665E">10 min</span></button>
    <a href="Done.dc.html" style="height: 64px; border-radius: 22px; background: #1E2B45; color: #F5F1E8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 10px 22px rgba(30,43,69,0.22)"><span style="font-size: 14px; font-weight: 700">Good</span><span style="font-size: 11px; color: #C9CCD6">2 days</span></a>
    <button style="height: 64px; border-radius: 22px; border: 1px solid #E8E1D3; background: #FFFDF8; color: #1C1C1C; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 14px; font-weight: 700">Easy</span><span style="font-size: 11px; color: #6B665E">5 days</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
