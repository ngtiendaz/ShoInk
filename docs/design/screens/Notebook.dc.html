<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>
  <div aria-hidden="true" style="position: absolute; right: -50px; top: 36px; width: 150px; height: 150px; border-radius: 50%; background: #EFD9D3"></div>

  <div style="position: relative; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 0 4px">
      <h1 style="margin: 0; font-family: 'Shippori Mincho', serif; font-weight: 800; font-size: 40px; letter-spacing: 0.06em">手帳</h1>
      <span style="font-size: 16px; color: #6B665E">Notebook</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 0; padding: 12px 14px; background: #1E2B45; color: #F5F1E8; border-radius: 18px"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">128</span><span style="font-size: 12px; color: #C9CCD6">words</span></div>
      <div style="display: flex; flex-direction: column; gap: 0; padding: 12px 14px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 18px"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">312</span><span style="font-size: 12px; color: #6B665E">characters</span></div>
      <div style="display: flex; flex-direction: column; gap: 0; padding: 12px 14px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 18px"><span style="font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700">23</span><span style="font-size: 12px; color: #6B665E">phrases</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 22px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
        <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">NOVEMBER · DAILY SEALS</span>
        <span style="font-size: 12px; color: #6B665E">13 / 15</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; font-size: 10px; color: #8C8579; text-align: center">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="36">
          <sc-if value="{{d.done}}" hint-placeholder-val="{{ true }}">
            <span style="height: 30px; border-radius: 10px; background: #B23A30; color: #FFFDF8; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 12px; font-weight: 700">{{d.n}}</span>
          </sc-if>
          <sc-if value="{{d.missed}}" hint-placeholder-val="{{ false }}">
            <span style="height: 30px; border-radius: 10px; border: 1px dashed #CFC6B5; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8C8579">{{d.n}}</span>
          </sc-if>
          <sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
            <span style="height: 30px; border-radius: 10px; border: 1.5px solid #1E2B45; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #1E2B45">{{d.n}}</span>
          </sc-if>
          <sc-if value="{{d.future}}" hint-placeholder-val="{{ false }}">
            <span style="height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8C8579">{{d.n}}</span>
          </sc-if>
          <sc-if value="{{d.blank}}" hint-placeholder-val="{{ false }}">
            <span style="height: 30px"></span>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; padding: 6px 14px 4px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 22px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 2px">
        <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">DUE FOR REVIEW · 12</span>
        <a href="Review.dc.html" style="height: 32px; padding: 0 14px; border-radius: 16px; background: #1C1C1C; color: #F5F1E8; font-size: 12px; font-weight: 500; display: flex; align-items: center">Review now</a>
      </div>
      <sc-for list="{{words}}" as="w" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 9px 2px; border-top: 1px solid #EDE7DB">
          <span style="font-family: 'Klee One', serif; font-size: 22px; min-width: 64px">{{w.kanji}}</span>
          <div style="display: flex; flex-direction: column; gap: 0; flex-grow: 1">
            <span style="font-size: 12px; color: #6B665E">{{w.kana}}</span>
            <span style="font-size: 14px">{{w.en}}</span>
          </div>
          <span style="font-size: 11px; color: #6B665E; background: #F1ECE2; padding: 3px 8px; border-radius: 999px">{{w.due}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="position: relative; margin: 12px 20px 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 30px; box-shadow: 0 8px 24px rgba(30,43,69,0.08)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5" fill="currentColor"></circle></svg>Today</a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"></path></svg>Review</a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"></path></svg>Journal</a>
    <a href="Notebook.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; border-radius: 24px; background: #1E2B45; color: #F5F1E8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6zM10 3v18"></path></svg>Notebook</a>
    <a href="Me.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 7px 0; color: #6B665E">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Nov 2026 starts on Sunday; Monday-first grid → 6 blanks
    const days = [];
    for (let i = 0; i < 6; i++) days.push({ blank: true });
    const missed = [4, 9];
    for (let n = 1; n <= 30; n++) {
      if (n === 15) days.push({ n, today: true });
      else if (n > 15) days.push({ n, future: true });
      else if (missed.includes(n)) days.push({ n, missed: true });
      else days.push({ n, done: true });
    }
    const words = [
      { kanji: '季節', kana: 'きせつ', en: 'season', due: 'today' },
      { kanji: '静か', kana: 'しずか', en: 'quiet, calm', due: 'today' },
      { kanji: '約束', kana: 'やくそく', en: 'promise', due: 'yesterday' }
    ];
    return { days, words };
  }
}
</script>
</body>
</html>
