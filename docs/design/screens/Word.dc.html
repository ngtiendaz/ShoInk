<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&amp;family=Klee+One:wght@400;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C1C1C;text-decoration:none}a:hover{color:#B23A30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1E8; color: #1C1C1C; font-family: 'Zen Kaku Gothic New', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
    <defs>
      <pattern id="shippoLight" width="32" height="32" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="#1E2B45" stroke-opacity="0.07" stroke-width="0.8">
          <circle cx="0" cy="0" r="16"></circle><circle cx="32" cy="0" r="16"></circle><circle cx="0" cy="32" r="16"></circle><circle cx="32" cy="32" r="16"></circle><circle cx="16" cy="16" r="16"></circle>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#shippoLight)"></rect>
  </svg>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 92px; width: 230px; height: 230px; margin-left: -115px; border-radius: 50%; background: #EFD9D3"></div>

  <div style="position: relative; padding: 54px 16px 0; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFDF8; border: 1px solid #E8E1D3; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 12px; color: #6B665E; letter-spacing: 0.14em">WORD OF THE DAY</span>
    <button aria-label="Save to notebook" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFDF8; border: 1px solid #E8E1D3; color: #1C1C1C; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </button>
  </div>

  <div style="position: relative; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 0">
      <div style="display: flex; gap: 2px; align-items: flex-end">
        <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px; color: #6B665E; font-family: 'Klee One', serif">こ</span><span style="font-family: 'Klee One', serif; font-weight: 600; font-size: 62px; line-height: 1.1">木</span></div>
        <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px; color: #6B665E; font-family: 'Klee One', serif">も</span><span style="font-family: 'Klee One', serif; font-weight: 600; font-size: 62px; line-height: 1.1">漏</span></div>
        <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px; color: transparent">・</span><span style="font-family: 'Klee One', serif; font-weight: 600; font-size: 62px; line-height: 1.1">れ</span></div>
        <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px; color: #6B665E; font-family: 'Klee One', serif">び</span><span style="font-family: 'Klee One', serif; font-weight: 600; font-size: 62px; line-height: 1.1">日</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 13px; color: #1C1C1C">komorebi</span>
        <span style="font-size: 11px; font-weight: 700; color: #1E2B45; background: #E7EAF1; padding: 3px 9px; border-radius: 999px">noun · N2</span>
        <button style="height: 34px; padding: 0 14px 0 10px; border-radius: 17px; border: none; background: #1E2B45; color: #F5F1E8; font-family: inherit; font-size: 13px; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7"></path></svg>Listen</button>
      </div>
      <p style="margin: 2px 0 0; font-size: 18px; text-align: center; line-height: 1.45; font-weight: 500">Sunlight filtering through the leaves</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">CHARACTERS</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0; padding: 10px 0 8px; border-radius: 16px; background: #1E2B45; color: #F5F1E8"><span style="font-family: 'Klee One', serif; font-size: 28px">木</span><span style="font-size: 11px; color: #C9CCD6">tree · 4</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0; padding: 10px 0 8px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E8E1D3"><span style="font-family: 'Klee One', serif; font-size: 28px">漏</span><span style="font-size: 11px; color: #6B665E">leak · 14</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0; padding: 10px 0 8px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E8E1D3"><span style="font-family: 'Klee One', serif; font-size: 28px">れ</span><span style="font-size: 11px; color: #6B665E">kana · 2</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0; padding: 10px 0 8px; border-radius: 16px; background: #FFFDF8; border: 1px solid #E8E1D3"><span style="font-family: 'Klee One', serif; font-size: 28px">日</span><span style="font-size: 11px; color: #6B665E">sun · 4</span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFDF8; border: 1px solid #E8E1D3; border-radius: 20px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
        <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">STROKE ORDER · 木</span>
        <span style="font-size: 12px; color: #6B665E">On モク · Kun き</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <svg viewBox="0 0 100 100" role="img" aria-label="Stroke 1: horizontal" style="background: #F8F4EC; border-radius: 12px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="1" stroke-dasharray="3 3"></path>
          <path d="M18 38 L82 36" stroke="#B23A30" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <text x="12" y="33" font-size="11" fill="#B23A30" font-family="sans-serif">1</text>
        </svg>
        <svg viewBox="0 0 100 100" role="img" aria-label="Stroke 2: vertical" style="background: #F8F4EC; border-radius: 12px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="1" stroke-dasharray="3 3"></path>
          <path d="M18 38 L82 36" stroke="#1C1C1C" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <path d="M50 12 L50 90" stroke="#B23A30" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <text x="55" y="20" font-size="11" fill="#B23A30" font-family="sans-serif">2</text>
        </svg>
        <svg viewBox="0 0 100 100" role="img" aria-label="Stroke 3: left sweep" style="background: #F8F4EC; border-radius: 12px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="1" stroke-dasharray="3 3"></path>
          <path d="M18 38 L82 36M50 12 L50 90" stroke="#1C1C1C" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <path d="M47 42 Q36 62 16 76" stroke="#B23A30" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <text x="30" y="52" font-size="11" fill="#B23A30" font-family="sans-serif">3</text>
        </svg>
        <svg viewBox="0 0 100 100" role="img" aria-label="Stroke 4: right sweep" style="background: #F8F4EC; border-radius: 12px">
          <path d="M50 6V94M6 50H94" stroke="#E8E1D3" stroke-width="1" stroke-dasharray="3 3"></path>
          <path d="M18 38 L82 36M50 12 L50 90M47 42 Q36 62 16 76" stroke="#1C1C1C" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <path d="M53 42 Q66 62 86 74" stroke="#B23A30" stroke-width="6" stroke-linecap="round" fill="none"></path>
          <text x="64" y="52" font-size="11" fill="#B23A30" font-family="sans-serif">4</text>
        </svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <span style="font-size: 11px; color: #6B665E; letter-spacing: 0.14em">EXAMPLE</span>
      <span style="font-family: 'Shippori Mincho', serif; font-size: 17px; line-height: 1.6">公園の<span style="border-bottom: 2px solid #B23A30">木漏れ日</span>が気持ちいい。</span>
      <span style="font-size: 14px; color: #6B665E; line-height: 1.45">The sunlight through the trees in the park feels lovely.</span>
    </div>
  </div>

  <div style="position: relative; padding: 0 20px 36px">
    <a href="Write.dc.html" style="display: flex; justify-content: center; align-items: center; gap: 10px; height: 58px; background: #1C1C1C; color: #F5F1E8; border-radius: 29px; font-size: 16px; font-weight: 500; box-shadow: 0 10px 24px rgba(28,28,28,0.18)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"></path></svg>Start writing</a>
  </div>
</div>
